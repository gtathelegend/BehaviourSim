[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "behaviorsim"
dynamic = ["version"]
description = "BehaviorSim: Synthetic Sequential Behavioral Data Generation Library"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "CLSI-ADAPT Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
parquet = [
    "pyarrow>=10.0.0",
]
dev = [
    "pytest>=7.0.0",
    "scikit-learn>=1.2.0",
    "xgboost>=2.0.0",
    "shap>=0.44.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.scripts]
behaviorsim = "behaviorsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["behaviorsim*"]

[tool.setuptools.dynamic]
version = { attr = "behaviorsim.__version__" }
